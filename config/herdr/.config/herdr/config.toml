onboarding = false

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = false

[keys]
next_workspace = "alt+n"
prefix = "ctrl+a"
previous_workspace = "alt+p"
split_horizontal = 'prefix+"'
split_vertical = 'prefix+%'
switch_tab = "cmd+1..9"
switch_workspace = "alt+1..9"

[terminal]
default_shell = "/opt/homebrew/bin/fish"
new_cwd = "follow"

[theme]
auto_switch = true
dark_name = "gruvbox"
light_name = "gruvbox-light"
name = "gruvbox"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[worktrees]
directory = "~/Code/.worktrees"
