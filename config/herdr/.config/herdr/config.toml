onboarding = false

[theme]
name = "terminal"

auto_switch = false

[theme.custom]
overlay0 = "#d7d7d7"
overlay1 = "#ffffff"
mauve = "#ff5fff"
green = "#5fff5f"
yellow = "#ffff5f"
red = "#ff5f5f"
blue = "#5fafff"
teal = "#00ffff"
peach = "#ffaf5f"

[terminal]
default_shell = "/opt/homebrew/bin/fish"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

previous_workspace = "alt+p"
next_workspace = "alt+n"
switch_workspace = "prefix+shift+1..9"

switch_tab = "prefix+1..9"
focus_agent = "prefix+alt+1..9"

split_vertical = 'prefix+%'
split_horizontal = 'prefix+"'

resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "fish"
description = "open scratch terminal"
width = "80%"
height = "80%"

[worktrees]
directory = "~/Code/.worktrees"

[ui]
accent = "#00d7ff"
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
sidebar_max_width = 44
hide_tab_bar_when_single_tab = true

agent_panel_sort = "priority"
status_indicators = "symbols"

tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "· %F %I:%M:%S %P ·" },
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", dim = true }],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "agent", dim = true }],
]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.toast]
delivery = "terminal"
