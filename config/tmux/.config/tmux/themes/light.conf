# Light surface. The per-session accent (@theme) lives in ~/.tmux.conf; the
# bright accents read on this near-white bar the same way they do on the dark
# one (accent boxes carry their own dark text), so the colour map is shared.
set -g @bg "#fafafa"
set -g @fg "#1a1a1a"

set -g status-bg "#fafafa"
set -g pane-border-style "fg=#fafafa"
