# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

format = """
$time$hostname$directory$git_branch$git_status
$character"""

# Blank line between the previous command's output and the next prompt.
add_newline = true

[time]
disabled = false
time_format = "%Y-%m-%d %H:%M:%S"
utc_time_offset = "0"
format = '❬[$time UTC]($style)❭'
style = "white"

[hostname]
disabled = false
ssh_only = true
format = '❬[$hostname]($style)❭'
style = "bold red"

[directory]
format = '❬[$path]($style)[$read_only]($read_only_style)❭'
style = "green"
truncation_length = 3
truncation_symbol = "../"
truncate_to_repo = false

[git_branch]
format = '❬[$branch]($style)'
style = "white"

[git_status]
format = '[($all_status$ahead_behind)]($style)❭'
style = "red"
conflicted = "!"
ahead = "^"
behind = "v"
diverged = "^v"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = ">"
deleted = "x"

[character]
success_symbol = '[●](green)'
error_symbol = '[●](red)'
